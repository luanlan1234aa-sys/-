<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2449a7"><title>跌倒／坠床与护理不良事件｜在线模拟考试</title><style>
:root{--bg:#f5f7fb;--card:white;--ink:#182236;--muted:#637087;--line:#e4eaf3;--blue:#3765e8;--light:#eef3ff;--green:#11885a;--red:#bf3e4c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}.wrap{max-width:850px;margin:auto;padding:22px 16px 110px}header{padding:27px 25px;background:linear-gradient(130deg,#2449a7,#537be9);color:white;border-radius:20px;box-shadow:0 10px 25px #21499e2e}header h1{margin:0;font-size:27px}header p{margin:9px 0 0;opacity:.9;font-size:14px}.tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.tag{background:#ffffff25;border:1px solid #ffffff45;border-radius:50px;padding:3px 11px;font-size:12px}.note{background:#fff9e8;border:1px solid #f3deb0;border-radius:12px;padding:13px 16px;margin:17px 0;font-size:13px;color:#715621}.panel{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}.panel strong{font-size:17px}.panel small{color:var(--muted)}.progress{height:9px;background:#dfe6f5;border-radius:20px;overflow:hidden;margin:7px 0 20px}.bar{height:100%;width:0;background:var(--blue);transition:width .2s}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px 20px;margin:14px 0;box-shadow:0 3px 12px #223c610b}.qhead{display:flex;gap:10px;align-items:start}.number{background:var(--light);color:var(--blue);padding:3px 9px;border-radius:9px;flex:none;font-weight:700;font-size:14px}.cat{font-size:12px;color:var(--muted);margin-bottom:4px}.question{font-size:16px;font-weight:650}.opts{display:grid;gap:8px;margin-top:15px}.option{display:flex;gap:10px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:white;transition:.15s}.option:hover{border-color:#95abfa;background:#f9fbff}.option:has(input:checked){background:var(--light);border-color:var(--blue)}input[type=radio]{accent-color:var(--blue);width:17px;height:17px;margin-top:5px;flex:none}.letter{font-weight:700;color:var(--blue);flex:none}.explain{margin-top:12px;border-radius:11px;padding:11px 13px;background:#eef9f3;font-size:13px;display:none}.wrong{border-color:#f0b7b7}.wrong .explain{background:#fff0f1}.card.review .explain{display:block}.option.correct{border-color:var(--green)!important;background:#edfaf3!important}.option.incorrect{border-color:var(--red)!important;background:#fff0f1!important}.toolbar{position:fixed;bottom:0;left:0;right:0;background:#ffffffeb;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px max(15px,calc((100vw - 820px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:10}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;padding:12px 22px;cursor:pointer}.secondary{background:#e9eef8;color:#31415d}.btn:disabled{opacity:.45;cursor:not-allowed}.result{background:white;padding:20px;border-radius:17px;border:1px solid var(--line);margin:17px 0;display:none}.score{font-size:38px;font-weight:800;color:var(--blue)}.muted{color:var(--muted)}.hidden{display:none!important}@media(max-width:570px){header h1{font-size:23px}.card{padding:15px}.question{font-size:15px}.toolbar{padding:10px 14px}.btn{padding:10px 14px;font-size:14px}}
</style></head><body><main class="wrap"><header><h1>跌倒／坠床与护理不良事件</h1><p>护理安全知识 · 交互式模拟考试</p><div class="tags"><span class="tag">30道单选题</span><span class="tag">每题约3.33分</span><span class="tag">提交自动评分</span><span class="tag">支持手机答题</span></div></header><div class="note">依据你上传的6张科室学习资料编写，适用于学习与模拟练习。个别条目在制度正文、附件的阈值有轻微差异，出题时优先采用附件量表；考试及临床执行请以本院现行正式制度为准。该网页不上传个人答案，也不会自动收集同事的成绩。</div><div id="result" class="result"></div><div class="panel"><strong>单选题 · 请选择最佳答案</strong><small id="count">已答 0 / 30</small></div><div class="progress"><div class="bar" id="bar"></div></div><div id="questions"></div></main><div class="toolbar"><span style="font-size:12px;color:#637087">完成后点击交卷</span><div style="display:flex;gap:9px"><button class="btn secondary hidden" id="retry" onclick="retry()">重新作答</button><button class="btn" id="submit" onclick="submitQuiz()">提交试卷</button></div></div><script>
const QUESTIONS=[{"q": "患者在诊疗过程中发生非预期死亡，属于哪类护理不良事件？", "options": ["Ⅰ类（警告事件）", "Ⅱ类（不良后果事件）", "Ⅲ类（未造成后果事件）", "Ⅳ类（隐患事件）"], "answer": 0, "explain": "Ⅰ类包括非预期死亡或非疾病自然进展造成的永久性功能丧失。", "category": "不良事件分类"}, {"q": "因诊疗活动而非疾病本身造成患者身体与功能损害，属于哪类事件？", "options": ["Ⅰ类", "Ⅱ类", "Ⅲ类", "Ⅳ类"], "answer": 1, "explain": "Ⅱ类是不良后果事件。", "category": "不良事件分类"}, {"q": "发生了错误事实，但未造成伤害，或仅有轻微后果且无需处理即可恢复，属于哪类事件？", "options": ["Ⅰ类", "Ⅱ类", "Ⅲ类", "Ⅳ类"], "answer": 2, "explain": "Ⅲ类是未造成后果事件。", "category": "不良事件分类"}, {"q": "护士及时发现即将发生的给药错误，错误最终未形成事实，属于哪类事件？", "options": ["Ⅰ类", "Ⅱ类", "Ⅲ类", "Ⅳ类"], "answer": 3, "explain": "Ⅳ类为隐患事件：及时发现错误，尚未形成事实。", "category": "不良事件分类"}, {"q": "病房存在可能引发不良事件的环境条件，按资料中的伤害程度分级为？", "options": ["A级", "B级", "C级", "D级"], "answer": 0, "explain": "A级：客观环境或条件可能引发事件隐患。", "category": "伤害程度分级"}, {"q": "不良事件已经发生，但尚未累及患者，属于？", "options": ["A级", "B级", "C级", "D级"], "answer": 1, "explain": "B级：不良事件发生但未累及患者。", "category": "伤害程度分级"}, {"q": "不良事件累及患者，但没有造成伤害，属于？", "options": ["B级", "C级", "D级", "E级"], "answer": 1, "explain": "C级：累及患者，但没有造成伤害。", "category": "伤害程度分级"}, {"q": "事件累及患者，需要额外监测以确保没有伤害，属于？", "options": ["C级", "D级", "E级", "F级"], "answer": 1, "explain": "D级：需要监测确认无伤害，或通过干预阻止伤害。", "category": "伤害程度分级"}, {"q": "不良事件使患者出现暂时性伤害，并需要治疗或干预，属于？", "options": ["D级", "E级", "F级", "G级"], "answer": 1, "explain": "E级：暂时性伤害，需治疗或干预。", "category": "伤害程度分级"}, {"q": "不良事件造成暂时性伤害，且患者因此需要住院或延长住院时间，属于？", "options": ["E级", "F级", "G级", "H级"], "answer": 1, "explain": "F级：暂时性伤害且需要住院或延长住院时间。", "category": "伤害程度分级"}, {"q": "不良事件造成患者永久性伤害，但不需要抢救生命，属于？", "options": ["F级", "G级", "H级", "I级"], "answer": 1, "explain": "G级：永久性伤害（不需要抢救生命的治疗抢救）。", "category": "伤害程度分级"}, {"q": "不良事件发生后必须持续进行维持生命的治疗抢救，属于？", "options": ["F级", "G级", "H级", "I级"], "answer": 2, "explain": "H级：需要持续治疗抢救生命。", "category": "伤害程度分级"}, {"q": "不良事件直接导致患者死亡，属于？", "options": ["F级", "G级", "H级", "I级"], "answer": 3, "explain": "I级：不良事件发生导致患者死亡。", "category": "伤害程度分级"}, {"q": "按照资料，患者“坠床”是指？", "options": ["从一个平面跌落至另一平面", "身体非故意从床上坠落，掉于地面或其他物体上", "主动从床上起身", "站立时眩晕"], "answer": 1, "explain": "资料中坠床的定义为身体非故意从床上坠落，掉于地面或其他物体上。", "category": "概念与评估"}, {"q": "成人患者应使用哪一种跌倒风险评估工具？", "options": ["Humpty Dumpty量表", "John Hopkins跌倒风险评估表", "Braden量表", "NRS疼痛量表"], "answer": 1, "explain": "资料规定成人使用John Hopkins（约翰·霍普金斯）跌倒风险评估表。", "category": "概念与评估"}, {"q": "按照附件1表格，成人John Hopkins跌倒风险评估的高危界值为？", "options": ["≥6分", "≥12分", "≥14分", "≥20分"], "answer": 2, "explain": "附件1备注：低危0—5分，中危6—13分，高危≥14分。正文低危阈值有细微出入，本题以附件表格为准。", "category": "概念与评估"}, {"q": "成人John Hopkins量表中，“近6个月曾有不明原因跌倒经历”计几分？", "options": ["1分", "3分", "5分", "7分"], "answer": 2, "explain": "附件1：近6个月有不明原因跌倒经历，计5分。", "category": "成人量表"}, {"q": "成人John Hopkins量表中，“过去24小时之内有手术镇静史”计几分？", "options": ["2分", "3分", "5分", "7分"], "answer": 3, "explain": "附件1此项记7分。", "category": "成人量表"}, {"q": "成人John Hopkins量表中，患者携带2种导管，计几分？", "options": ["1分", "2分", "3分", "5分"], "answer": 1, "explain": "患者携带2种导管为2分。", "category": "成人量表"}, {"q": "儿童跌倒风险评估采用哪一种工具？", "options": ["Humpty Dumpty Fall Scale", "Morse跌倒量表", "John Hopkins成人跌倒风险评估表", "Barthel指数"], "answer": 0, "explain": "资料规定儿童采用Humpty Dumpty Fall Scale（HDFS）。", "category": "儿童量表"}, {"q": "按附件2，儿童跌倒风险评估达到多少分为高危？", "options": ["≥7分", "≥10分", "≥12分", "≥14分"], "answer": 2, "explain": "附件2：≥12分为高危。", "category": "儿童量表"}, {"q": "按附件2，儿童HDFS量表中，3～7岁年龄项计几分？", "options": ["1分", "2分", "3分", "4分"], "answer": 2, "explain": "附件2年龄项：3～7岁计3分。", "category": "儿童量表"}, {"q": "根据资料，应在入院后多长时间内完成首次跌倒风险评估？", "options": ["2小时内", "4小时内", "8小时内", "24小时内"], "answer": 2, "explain": "资料4.2：入院8小时内首次评估。", "category": "评估与预防"}, {"q": "下列哪种情形需要重新评估跌倒风险？", "options": ["只有出院时", "转科、病情变化、手术或跌倒后", "只有患者提出要求时", "每次进食后"], "answer": 1, "explain": "转科、病情变化、手术及跌倒后应再次评估并记录。", "category": "评估与预防"}, {"q": "对于中高危跌倒风险患者，下列哪项符合资料要求？", "options": ["取消任何标识以保护隐私", "在手腕带、床头卡作标记并签署告知书", "无需再次评估", "只在病历写一句高危即可"], "answer": 1, "explain": "4.3要求高危标记及签署《防病员跌倒/坠床告知书》。", "category": "评估与预防"}, {"q": "下列哪项属于资料中正确的跌倒预防宣教？", "options": ["夜间起床越快越好", "常穿易脱落的拖鞋", "卧位起身先平躺30秒、坐起30秒、站立30秒，再行走", "床栏升起后无需提醒患者"], "answer": 2, "explain": "资料中的“三部曲”：平躺30秒、坐起30秒、站立30秒后再行走，且应根据个人病情调整。", "category": "评估与预防"}, {"q": "患者跌倒后，护士首先应如何处理？", "options": ["立即扶起让患者走动", "先评估神志、瞳孔、生命体征和受伤部位并妥善安置", "先填写事件表", "先联系家属再评估"], "answer": 1, "explain": "跌倒后先做安全与伤情评估，不能不顾伤情立即扶起。", "category": "跌倒后处理"}, {"q": "患者跌倒后病情严重，按照资料应及时给予哪些支持？", "options": ["仅观察即可", "吸氧、心电监护、建立静脉通路等", "立即让患者自行下床", "停止通知医生"], "answer": 1, "explain": "资料4.6.1提到病情严重时给氧、心电监护、建立静脉通路。", "category": "跌倒后处理"}, {"q": "患者跌倒后，以下哪项不属于恰当的后续工作？", "options": ["通知主管或值班医生", "分析原因并重新评估风险", "准确记录经过与处理情况", "避免上报，以免影响科室评分"], "answer": 3, "explain": "资料要求通知医生、记录、分析原因、落实防范措施，并依规定上报。", "category": "跌倒后处理"}, {"q": "按上传的制度，护士长应在多长时间内通过网络填写护理不良事件报表？", "options": ["2小时内", "8小时内", "24小时内", "72小时内"], "answer": 2, "explain": "资料4.6.8：护士长在24小时内网络填写护理不良事件报表。", "category": "跌倒后处理"}];const letters=['A','B','C','D'];const root=document.getElementById('questions');let submitted=false;let selected=Array(QUESTIONS.length).fill(null);
function render(){root.innerHTML=QUESTIONS.map((q,i)=>`<article class="card" id="q${i}"><div class="qhead"><span class="number">${i+1}</span><div><div class="cat">${q.category}</div><div class="question">${q.q}</div></div></div><div class="opts">${q.options.map((o,j)=>`<label class="option" data-i="${i}" data-j="${j}"><input type="radio" name="q${i}" value="${j}" ${selected[i]===j?'checked':''} ${submitted?'disabled':''}><span class="letter">${letters[j]}.</span><span>${o}</span></label>`).join('')}</div><div class="explain"><strong>正确答案：${letters[q.answer]}</strong><br>${q.explain}</div></article>`).join('');if(submitted){QUESTIONS.forEach((q,i)=>{let card=document.getElementById('q'+i);card.classList.add('review');if(selected[i]!==q.answer)card.classList.add('wrong');card.querySelectorAll('.option').forEach((o,j)=>{if(j===q.answer)o.classList.add('correct');if(j===selected[i]&&j!==q.answer)o.classList.add('incorrect')})})}else document.querySelectorAll('input[type=radio]').forEach(e=>e.addEventListener('change',ev=>{selected[+ev.target.name.slice(1)]=+ev.target.value;update()}));update()}
function update(){let n=selected.filter(v=>v!==null).length;document.getElementById('count').textContent=`已答 ${n} / ${QUESTIONS.length}`;document.getElementById('bar').style.width=(100*n/QUESTIONS.length)+'%'}
function submitQuiz(){if(submitted)return;let missing=selected.findIndex(v=>v===null);if(missing>=0){if(!confirm(`还有 ${selected.filter(v=>v===null).length} 题未作答，确定提交吗？`)){document.getElementById('q'+missing).scrollIntoView({behavior:'smooth',block:'center'});return}}submitted=true;let good=QUESTIONS.filter((q,i)=>selected[i]===q.answer).length;let rate=Math.round(100*good/QUESTIONS.length);let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div class="muted">本次考试成绩</div><div class="score">${rate} 分</div><strong>答对 ${good} 题 / 共 ${QUESTIONS.length} 题</strong><div class="muted">下方已标出正确答案、错题及解析。红色表示你选择的错误答案，绿色表示正确答案。</div><button class="btn secondary" onclick="showErrors()" style="margin-top:12px">仅看错题</button>`;document.getElementById('submit').disabled=true;document.getElementById('retry').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
function showErrors(){let only=document.querySelectorAll('.card:not(.wrong)').length>0;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',only&&!c.classList.contains('wrong')));document.querySelector('#result button').textContent=only?'显示全部题目':'仅看错题'}
function retry(){if(!confirm('重新开始将清空本次作答，确定吗？'))return;selected=Array(QUESTIONS.length).fill(null);submitted=false;document.getElementById('result').style.display='none';document.getElementById('submit').disabled=false;document.getElementById('retry').classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
